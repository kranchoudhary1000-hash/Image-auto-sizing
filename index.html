<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhotoCraft Pro – Premium Photo Sheet Maker</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- html2canvas for fallback or preview, but we use canvas directly for sheet -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ========== GLOBAL & THEME ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.75);
      --text-primary: #0b1e33;
      --text-secondary: #2c3e50;
      --accent-blue: #2563eb;
      --accent-violet: #7c3aed;
      --accent-gradient: linear-gradient(135deg, #2563eb, #7c3aed);
      --border-light: #e2e8f0;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      --radius-card: 24px;
      --radius-btn: 14px;
      --transition: all 0.2s ease;
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-glass: rgba(30, 41, 59, 0.8);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ========== LAYOUT ========== */
    .app-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: var(--accent-gradient);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      color: var(--text-primary);
    }

    .theme-toggle:hover {
      border-color: var(--accent-blue);
    }

    .theme-toggle i {
      width: 20px;
      height: 20px;
    }

    /* ========== DASHBOARD GRID ========== */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    /* ========== CARDS ========== */
    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      transition: var(--transition);
    }

    .card-glass {
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .card-title i {
      color: var(--accent-blue);
      width: 22px;
      height: 22px;
    }

    /* ========== UPLOAD AREA ========== */
    .upload-zone {
      border: 2px dashed var(--border-light);
      border-radius: 20px;
      padding: 32px 20px;
      text-align: center;
      background: var(--bg);
      transition: var(--transition);
      cursor: pointer;
      margin-bottom: 16px;
    }

    .upload-zone:hover {
      border-color: var(--accent-blue);
      background: rgba(37, 99, 235, 0.03);
    }

    .upload-zone.drag-over {
      border-color: var(--accent-violet);
      background: rgba(124, 58, 237, 0.05);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      color: var(--accent-blue);
      margin-bottom: 12px;
    }

    .upload-title {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .upload-sub {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }

    .image-preview-box {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 35/45;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .image-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .preview-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border-light);
      padding: 10px 16px;
      border-radius: var(--radius-btn);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
    }

    .btn-icon:hover {
      background: var(--bg);
      border-color: var(--accent-blue);
    }

    .btn-icon i {
      width: 18px;
      height: 18px;
    }

    /* ========== QUANTITY CONTROLS ========== */
    .quantity-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .preset-btn {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 8px 16px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .preset-btn.active {
      background: var(--accent-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .preset-btn:hover {
      border-color: var(--accent-blue);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-radius: 60px;
      padding: 4px;
      border: 1px solid var(--border-light);
      width: fit-content;
    }

    .stepper button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .stepper button:hover {
      background: var(--accent-blue);
      color: white;
    }

    .stepper input {
      width: 70px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-primary);
      outline: none;
      -moz-appearance: textfield;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ========== SIZE & LAYOUT ========== */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .input-group input, .input-group select {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .size-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .size-preset-btn {
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
    }

    .size-preset-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: transparent;
    }

    /* ========== PREVIEW PANEL ========== */
    .preview-panel {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 500px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .preview-stats {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .canvas-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      border-radius: 16px;
      padding: 16px;
      min-height: 400px;
      overflow: auto;
    }

    #sheetCanvas {
      max-width: 100%;
      height: auto;
      background: white;
      box-shadow: var(--shadow-lg);
      border-radius: 4px;
      transition: transform 0.2s;
      display: block;
    }

    .preview-actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      padding: 14px 24px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: var(--bg);
      border-color: var(--accent-blue);
    }

    /* ========== TOAST & NOTIFICATIONS ========== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .toast {
      background: var(--surface);
      color: var(--text-primary);
      padding: 14px 22px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border-left: 6px solid var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
      font-weight: 500;
    }

    .toast.success {
      border-left-color: #10b981;
    }

    .toast.error {
      border-left-color: #ef4444;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== UTILITIES ========== */
    .hidden { display: none !important; }
    .text-sm { font-size: 0.85rem; color: var(--text-secondary); }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .gap-2 { gap: 8px; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 600px) {
      .app-container { padding: 16px 12px 32px; }
      .card { padding: 18px; }
      .grid-2col { grid-template-columns: 1fr; }
      .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
      .preview-actions-bar { flex-direction: column; }
      .toast-container { left: 16px; right: 16px; bottom: 16px; }
      .stepper { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-icon"><i data-lucide="camera"></i></div>
        <span class="logo-text">PhotoCraft Pro</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <i data-lucide="moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </header>

    <!-- Dashboard Grid -->
    <div class="dashboard">
      <!-- LEFT PANEL: Controls -->
      <div class="controls-panel">
        <!-- Upload Card -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-title"><i data-lucide="upload-cloud"></i> Upload Your Photo</div>
          <div class="upload-zone" id="uploadZone">
            <i data-lucide="image-plus" class="upload-icon"></i>
            <div class="upload-title">Drag and drop your image here</div>
            <div class="upload-sub">or <span style="color: var(--accent-blue); font-weight:600;">browse files</span></div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" class="hidden">
          </div>
          <div id="uploadError" class="text-sm" style="color: #ef4444; margin-top: 8px;"></div>
          <div id="previewArea" class="preview-container hidden">
            <div class="image-preview-box">
              <img id="uploadedImage" src="" alt="Uploaded preview">
            </div>
            <div class="preview-actions">
              <button class="btn-icon" id="replaceBtn"><i data-lucide="refresh-cw"></i> Replace</button>
              <button class="btn-icon" id="removeBtn"><i data-lucide="trash-2"></i> Remove</button>
            </div>
          </div>
        </div>

        <!-- Quantity Card -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-title"><i data-lucide="grid-3x3"></i> Customize Your Photo Sheet</div>
          <div class="quantity-presets" id="quantityPresets">
            <button class="preset-btn" data-qty="4">4</button>
            <button class="preset-btn" data-qty="8">8</button>
            <button class="preset-btn" data-qty="12">12</button>
            <button class="preset-btn" data-qty="16">16</button>
            <button class="preset-btn" data-qty="20">20</button>
            <button class="preset-btn" data-qty="24">24</button>
            <button class="preset-btn" data-qty="30">30</button>
            <button class="preset-btn" data-qty="35">35</button>
            <button class="preset-btn" data-qty="40">40</button>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="stepper">
              <button id="qtyMinus"><i data-lucide="minus"></i></button>
              <input type="number" id="quantityInput" value="12" min="1" max="200" step="1">
              <button id="qtyPlus"><i data-lucide="plus"></i></button>
            </div>
            <span class="text-sm" style="margin-left: auto;">Total photos: <strong id="totalPhotosDisplay">12</strong></span>
          </div>
        </div>

        <!-- Photo Size Card -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-title"><i data-lucide="ruler"></i> Photo Size</div>
          <div class="size-presets">
            <button class="size-preset-btn active" data-size="35x45">35×45 mm (Passport)</button>
            <button class="size-preset-btn" data-size="2x2">2×2 inch</button>
            <button class="size-preset-btn" data-size="4x6">4×6 inch</button>
            <button class="size-preset-btn" data-size="custom">Custom</button>
          </div>
          <div class="grid-2col">
            <div class="input-group">
              <label><i data-lucide="move-horizontal"></i> Width (mm)</label>
              <input type="number" id="photoWidthMm" value="35" min="10" max="300" step="1">
            </div>
            <div class="input-group">
              <label><i data-lucide="move-vertical"></i> Height (mm)</label>
              <input type="number" id="photoHeightMm" value="45" min="10" max="300" step="1">
            </div>
          </div>
          <div class="grid-2col mt-2">
            <div class="input-group">
              <label><i data-lucide="spacing-horizontal"></i> Gap (mm)</label>
              <input type="number" id="gapMm" value="2" min="0" max="20" step="1">
            </div>
            <div class="input-group">
              <label><i data-lucide="square"></i> Border (px)</label>
              <input type="number" id="borderWidth" value="1" min="0" max="10" step="1">
            </div>
          </div>
          <div class="grid-2col mt-2">
            <div class="input-group">
              <label><i data-lucide="palette"></i> Border color</label>
              <input type="color" id="borderColor" value="#cccccc">
            </div>
            <div class="input-group">
              <label><i data-lucide="layout"></i> Orientation</label>
              <select id="orientation">
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Paper & Layout Card -->
        <div class="card">
          <div class="card-title"><i data-lucide="file-text"></i> Paper & Layout</div>
          <div class="size-presets">
            <button class="size-preset-btn active" data-paper="a4">A4</button>
            <button class="size-preset-btn" data-paper="a5">A5</button>
            <button class="size-preset-btn" data-paper="4x6">4×6 inch</button>
            <button class="size-preset-btn" data-paper="custom">Custom</button>
          </div>
          <div class="grid-2col">
            <div class="input-group">
              <label>Paper width (mm)</label>
              <input type="number" id="paperWidthMm" value="210" min="50" max="1000" step="1">
            </div>
            <div class="input-group">
              <label>Paper height (mm)</label>
              <input type="number" id="paperHeightMm" value="297" min="50" max="1000" step="1">
            </div>
          </div>
          <div class="grid-2col mt-2">
            <div class="input-group">
              <label>Margin (mm)</label>
              <input type="number" id="marginMm" value="10" min="0" max="50" step="1">
            </div>
            <div class="input-group">
              <label>Rows</label>
              <input type="number" id="rowsInput" value="0" min="0" max="50" step="1" placeholder="Auto">
            </div>
          </div>
          <div class="grid-2col mt-2">
            <div class="input-group">
              <label>Columns</label>
              <input type="number" id="colsInput" value="0" min="0" max="50" step="1" placeholder="Auto">
            </div>
            <div class="input-group">
              <label>Page</label>
              <span id="pageInfo" class="text-sm" style="padding: 12px 0;">1 of 1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: Live Preview -->
      <div class="preview-panel">
        <div class="preview-header">
          <div class="card-title" style="margin-bottom: 0;"><i data-lucide="eye"></i> Live Preview</div>
          <div class="preview-stats">
            <span id="previewCount">12 photos</span>
            <span id="previewPages">1 page</span>
            <span id="previewDimensions">35×45 mm</span>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="sheetCanvas" width="600" height="800"></canvas>
        </div>
        <div class="preview-actions-bar">
          <button class="btn-primary" id="downloadPngBtn"><i data-lucide="download"></i> PNG</button>
          <button class="btn-primary" id="downloadJpegBtn" style="background: linear-gradient(135deg, #7c3aed, #2563eb);"><i data-lucide="image"></i> JPEG</button>
          <button class="btn-primary" id="downloadPdfBtn" style="background: linear-gradient(135deg, #0f172a, #334155);"><i data-lucide="file-text"></i> PDF</button>
          <button class="btn-secondary" id="printBtn"><i data-lucide="printer"></i> Print</button>
          <button class="btn-secondary" id="resetBtn"><i data-lucide="rotate-ccw"></i> Reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script>
    (function() {
      // ============================================================
      // STATE
      // ============================================================
      const state = {
        image: null,               // HTMLImageElement
        imageLoaded: false,
        quantity: 12,
        photoWidthMm: 35,
        photoHeightMm: 45,
        gapMm: 2,
        borderWidth: 1,
        borderColor: '#cccccc',
        paperWidthMm: 210,
        paperHeightMm: 297,
        marginMm: 10,
        orientation: 'portrait',
        rows: 0,                   // 0 = auto
        cols: 0,                   // 0 = auto
        currentPage: 1,
        totalPages: 1,
        isDark: false,
      };

      // DOM elements
      const uploadZone = document.getElementById('uploadZone');
      const fileInput = document.getElementById('fileInput');
      const uploadError = document.getElementById('uploadError');
      const previewArea = document.getElementById('previewArea');
      const uploadedImage = document.getElementById('uploadedImage');
      const replaceBtn = document.getElementById('replaceBtn');
      const removeBtn = document.getElementById('removeBtn');
      const quantityInput = document.getElementById('quantityInput');
      const qtyMinus = document.getElementById('qtyMinus');
      const qtyPlus = document.getElementById('qtyPlus');
      const totalPhotosDisplay = document.getElementById('totalPhotosDisplay');
      const quantityPresets = document.getElementById('quantityPresets');
      const photoWidthMm = document.getElementById('photoWidthMm');
      const photoHeightMm = document.getElementById('photoHeightMm');
      const gapMm = document.getElementById('gapMm');
      const borderWidth = document.getElementById('borderWidth');
      const borderColor = document.getElementById('borderColor');
      const orientation = document.getElementById('orientation');
      const paperWidthMm = document.getElementById('paperWidthMm');
      const paperHeightMm = document.getElementById('paperHeightMm');
      const marginMm = document.getElementById('marginMm');
      const rowsInput = document.getElementById('rowsInput');
      const colsInput = document.getElementById('colsInput');
      const pageInfo = document.getElementById('pageInfo');
      const sheetCanvas = document.getElementById('sheetCanvas');
      const ctx = sheetCanvas.getContext('2d');
      const previewCount = document.getElementById('previewCount');
      const previewPages = document.getElementById('previewPages');
      const previewDimensions = document.getElementById('previewDimensions');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const toastContainer = document.getElementById('toastContainer');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const downloadPngBtn = document.getElementById('downloadPngBtn');
      const downloadJpegBtn = document.getElementById('downloadJpegBtn');
      const downloadPdfBtn = document.getElementById('downloadPdfBtn');
      const printBtn = document.getElementById('printBtn');
      const resetBtn = document.getElementById('resetBtn');

      // ============================================================
      // INIT
      // ============================================================
      function init() {
        lucide.createIcons();
        setupEventListeners();
        updateQuantityDisplay();
        // Set default active preset
        document.querySelector('.preset-btn[data-qty="12"]')?.classList.add('active');
        // Set default size preset
        document.querySelector('.size-preset-btn[data-size="35x45"]')?.classList.add('active');
        renderPreview();
        checkDarkMode();
      }

      // ============================================================
      // EVENT LISTENERS
      // ============================================================
      function setupEventListeners() {
        // Upload
        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', (e) => {
          e.preventDefault();
          uploadZone.classList.remove('drag-over');
          const file = e.dataTransfer.files[0];
          if (file) handleFile(file);
        });
        fileInput.addEventListener('change', (e) => {
          if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        replaceBtn.addEventListener('click', () => fileInput.click());
        removeBtn.addEventListener('click', removeImage);

        // Quantity
        qtyMinus.addEventListener('click', () => updateQuantity(state.quantity - 1));
        qtyPlus.addEventListener('click', () => updateQuantity(state.quantity + 1));
        quantityInput.addEventListener('change', (e) => {
          const val = parseInt(e.target.value);
          if (!isNaN(val) && val >= 1) updateQuantity(val);
          else quantityInput.value = state.quantity;
        });
        quantityPresets.querySelectorAll('.preset-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const qty = parseInt(btn.dataset.qty);
            updateQuantity(qty);
            // Update active class
            quantityPresets.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });

        // Photo size
        document.querySelectorAll('.size-preset-btn[data-size]').forEach(btn => {
          btn.addEventListener('click', () => {
            const size = btn.dataset.size;
            document.querySelectorAll('.size-preset-btn[data-size]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (size === '35x45') { photoWidthMm.value = 35; photoHeightMm.value = 45; }
            else if (size === '2x2') { photoWidthMm.value = 50.8; photoHeightMm.value = 50.8; }
            else if (size === '4x6') { photoWidthMm.value = 101.6; photoHeightMm.value = 152.4; }
            // custom does nothing
            updateStateFromInputs();
          });
        });

        // Paper size
        document.querySelectorAll('.size-preset-btn[data-paper]').forEach(btn => {
          btn.addEventListener('click', () => {
            const paper = btn.dataset.paper;
            document.querySelectorAll('.size-preset-btn[data-paper]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (paper === 'a4') { paperWidthMm.value = 210; paperHeightMm.value = 297; }
            else if (paper === 'a5') { paperWidthMm.value = 148; paperHeightMm.value = 210; }
            else if (paper === '4x6') { paperWidthMm.value = 101.6; paperHeightMm.value = 152.4; }
            updateStateFromInputs();
          });
        });

        // All numeric inputs
        [photoWidthMm, photoHeightMm, gapMm, borderWidth, paperWidthMm, paperHeightMm, marginMm, rowsInput, colsInput].forEach(input => {
          input.addEventListener('input', updateStateFromInputs);
        });
        borderColor.addEventListener('input', updateStateFromInputs);
        orientation.addEventListener('change', updateStateFromInputs);

        // Theme
        themeToggle.addEventListener('click', toggleDarkMode);

        // Download & Print
        downloadPngBtn.addEventListener('click', () => downloadImage('png'));
        downloadJpegBtn.addEventListener('click', () => downloadImage('jpeg'));
        downloadPdfBtn.addEventListener('click', downloadPDF);
        printBtn.addEventListener('click', printSheet);
        resetBtn.addEventListener('click', resetAll);
      }

      // ============================================================
      // FILE HANDLING
      // ============================================================
      function handleFile(file) {
        uploadError.textContent = '';
        const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
        if (!validTypes.includes(file.type)) {
          showToast('Please upload a JPG, PNG, or WEBP image.', 'error');
          uploadError.textContent = 'Invalid file type.';
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            state.image = img;
            state.imageLoaded = true;
            uploadedImage.src = e.target.result;
            previewArea.classList.remove('hidden');
            uploadZone.classList.add('hidden');
            renderPreview();
            showToast('Photo uploaded successfully!', 'success');
          };
          img.onerror = () => showToast('Failed to load image.', 'error');
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function removeImage() {
        state.image = null;
        state.imageLoaded = false;
        uploadedImage.src = '';
        previewArea.classList.add('hidden');
        uploadZone.classList.remove('hidden');
        renderPreview();
      }

      // ============================================================
      // QUANTITY
      // ============================================================
      function updateQuantity(val) {
        if (val < 1) val = 1;
        if (val > 200) val = 200;
        state.quantity = val;
        quantityInput.value = val;
        totalPhotosDisplay.textContent = val;
        // Update preset active state
        quantityPresets.querySelectorAll('.preset-btn').forEach(btn => {
          btn.classList.toggle('active', parseInt(btn.dataset.qty) === val);
        });
        renderPreview();
      }

      function updateQuantityDisplay() {
        quantityInput.value = state.quantity;
        totalPhotosDisplay.textContent = state.quantity;
      }

      // ============================================================
      // STATE SYNC
      // ============================================================
      function updateStateFromInputs() {
        state.photoWidthMm = parseFloat(photoWidthMm.value) || 35;
        state.photoHeightMm = parseFloat(photoHeightMm.value) || 45;
        state.gapMm = parseFloat(gapMm.value) || 0;
        state.borderWidth = parseInt(borderWidth.value) || 0;
        state.borderColor = borderColor.value;
        state.paperWidthMm = parseFloat(paperWidthMm.value) || 210;
        state.paperHeightMm = parseFloat(paperHeightMm.value) || 297;
        state.marginMm = parseFloat(marginMm.value) || 10;
        state.orientation = orientation.value;
        state.rows = parseInt(rowsInput.value) || 0;
        state.cols = parseInt(colsInput.value) || 0;
        renderPreview();
      }

      // ============================================================
      // LAYOUT CALCULATION
      // ============================================================
      function computeLayout() {
        // Determine effective paper dimensions based on orientation
        let paperW = state.paperWidthMm;
        let paperH = state.paperHeightMm;
        if (state.orientation === 'landscape') {
          [paperW, paperH] = [paperH, paperW];
        }

        const margin = state.marginMm;
        const photoW = state.photoWidthMm;
        const photoH = state.photoHeightMm;
        const gap = state.gapMm;

        const availableW = paperW - 2 * margin;
        const availableH = paperH - 2 * margin;

        // If user specified rows and cols, use them. Otherwise compute max fit.
        let rows, cols;
        if (state.rows > 0 && state.cols > 0) {
          rows = state.rows;
          cols = state.cols;
        } else {
          // Auto calculate max that fits
          cols = Math.floor((availableW + gap) / (photoW + gap));
          rows = Math.floor((availableH + gap) / (photoH + gap));
          if (cols < 1) cols = 1;
          if (rows < 1) rows = 1;
          // Limit by total quantity
          const maxPerPage = rows * cols;
          if (maxPerPage > state.quantity) {
            // reduce rows/cols to exactly fit quantity if possible, but keep grid
            // We'll keep max grid, but only draw quantity photos
          }
        }

        const perPage = rows * cols;
        const totalPages = Math.ceil(state.quantity / perPage);
        state.totalPages = totalPages;

        return { paperW, paperH, margin, photoW, photoH, gap, rows, cols, perPage, totalPages };
      }

      // ============================================================
      // RENDER PREVIEW
      // ============================================================
      function renderPreview() {
        if (!state.imageLoaded || !state.image) {
          // Draw placeholder
          const layout = computeLayout();
          drawCanvas(layout, true);
          updatePreviewStats(layout);
          return;
        }
        const layout = computeLayout();
        drawCanvas(layout, false);
        updatePreviewStats(layout);
      }

      function updatePreviewStats(layout) {
        previewCount.textContent = `${state.quantity} photos`;
        previewPages.textContent = `${layout.totalPages} page${layout.totalPages > 1 ? 's' : ''}`;
        previewDimensions.textContent = `${state.photoWidthMm}×${state.photoHeightMm} mm`;
        pageInfo.textContent = `1 of ${layout.totalPages}`;
      }

      // ============================================================
      // DRAW CANVAS (used for preview and export)
      // ============================================================
      function drawCanvas(layout, isPlaceholder, pageNum = 1) {
        const { paperW, paperH, margin, photoW, photoH, gap, rows, cols, perPage } = layout;

        // Set canvas size proportionally (max 800px)
        const maxDim = 800;
        const scale = Math.min(maxDim / paperW, maxDim / paperH);
        const canvasW = Math.round(paperW * scale);
        const canvasH = Math.round(paperH * scale);
        sheetCanvas.width = canvasW;
        sheetCanvas.height = canvasH;

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasW, canvasH);

        // Draw page outline (thin gray)
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, canvasW - 1, canvasH - 1);

        // If placeholder, draw message
        if (isPlaceholder) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = `${Math.round(16 * scale)}px Inter, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Upload a photo to see preview', canvasW / 2, canvasH / 2);
          return;
        }

        // Compute start offset to center the grid
        const totalGridW = cols * photoW + (cols - 1) * gap;
        const totalGridH = rows * photoH + (rows - 1) * gap;
        const offsetX = (paperW - totalGridW) / 2;
        const offsetY = (paperH - totalGridH) / 2;

        // Determine which photos to draw for this page
        const startIndex = (pageNum - 1) * perPage;
        let drawn = 0;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const idx = startIndex + r * cols + c;
            if (idx >= state.quantity) break;

            // Convert to canvas coordinates
            const x = (offsetX + c * (photoW + gap)) * scale;
            const y = (offsetY + r * (photoH + gap)) * scale;
            const w = photoW * scale;
            const h = photoH * scale;

            // Draw border if needed
            if (state.borderWidth > 0) {
              ctx.strokeStyle = state.borderColor;
              ctx.lineWidth = state.borderWidth * scale;
              ctx.strokeRect(x, y, w, h);
            }

            // Draw photo (cover fit to preserve aspect ratio, no stretching)
            drawImageCover(ctx, state.image, x, y, w, h);
            drawn++;
          }
          if (startIndex + (r + 1) * cols >= state.quantity) break;
        }

        // Draw page number if multiple pages
        if (layout.totalPages > 1) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = `${Math.round(12 * scale)}px Inter, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(`Page ${pageNum} of ${layout.totalPages}`, canvasW / 2, canvasH - 4);
        }
      }

      // Helper: draw image with cover fit (preserve aspect ratio, no stretch)
      function drawImageCover(ctx, img, x, y, w, h) {
        const imgAspect = img.width / img.height;
        const targetAspect = w / h;
        let sx, sy, sw, sh;
        if (imgAspect > targetAspect) {
          // Image wider than target: crop left/right
          sh = img.height;
          sw = sh * targetAspect;
          sx = (img.width - sw) / 2;
          sy = 0;
        } else {
          // Image taller than target: crop top/bottom
          sw = img.width;
          sh = sw / targetAspect;
          sx = 0;
          sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }

      // ============================================================
      // EXPORT FUNCTIONS
      // ============================================================
      function downloadImage(format) {
        if (!state.imageLoaded) {
          showToast('Please upload a photo first.', 'error');
          return;
        }
        showLoading(true);
        setTimeout(() => {
          try {
            const layout = computeLayout();
            // For export, use high resolution: 300 DPI equivalent
            // 1 mm = 300/25.4 ≈ 11.811 pixels
            const pxPerMm = 300 / 25.4;
            const exportScale = pxPerMm;

            const totalPages = layout.totalPages;
            // For simplicity, export first page as PNG/JPEG (multi-page not supported in single image)
            // If multiple pages, we export first page and notify
            const pageNum = 1;
            const { paperW, paperH, margin, photoW, photoH, gap, rows, cols, perPage } = layout;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = Math.round(paperW * exportScale);
            exportCanvas.height = Math.round(paperH * exportScale);
            const ectx = exportCanvas.getContext('2d');

            ectx.fillStyle = '#ffffff';
            ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            const totalGridW = cols * photoW + (cols - 1) * gap;
            const totalGridH = rows * photoH + (rows - 1) * gap;
            const offsetX = (paperW - totalGridW) / 2;
            const offsetY = (paperH - totalGridH) / 2;

            const startIndex = (pageNum - 1) * perPage;

            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const idx = startIndex + r * cols + c;
                if (idx >= state.quantity) break;
                const x = (offsetX + c * (photoW + gap)) * exportScale;
                const y = (offsetY + r * (photoH + gap)) * exportScale;
                const w = photoW * exportScale;
                const h = photoH * exportScale;

                if (state.borderWidth > 0) {
                  ectx.strokeStyle = state.borderColor;
                  ectx.lineWidth = state.borderWidth * exportScale;
                  ectx.strokeRect(x, y, w, h);
                }
                drawImageCover(ectx, state.image, x, y, w, h);
              }
              if (startIndex + (r + 1) * cols >= state.quantity) break;
            }

            const mime = format === 'png' ? 'image/png' : 'image/jpeg';
            const ext = format === 'png' ? 'png' : 'jpg';
            const quality = format === 'jpeg' ? 0.95 : undefined;

            exportCanvas.toBlob((blob) => {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `photocraft-sheet.${ext}`;
              a.click();
              URL.revokeObjectURL(url);
              showToast(`${format.toUpperCase()} downloaded successfully!`, 'success');
              showLoading(false);
            }, mime, quality);

            if (totalPages > 1) {
              showToast(`Note: Only page 1 of ${totalPages} exported. Use PDF for all pages.`, 'info');
            }
          } catch (err) {
            console.error(err);
            showToast('Export failed. Please try again.', 'error');
            showLoading(false);
          }
        }, 100);
      }

      function downloadPDF() {
        if (!state.imageLoaded) {
          showToast('Please upload a photo first.', 'error');
          return;
        }
        showLoading(true);
        setTimeout(() => {
          try {
            const { jsPDF } = window.jspdf;
            const layout = computeLayout();
            const { paperW, paperH, margin, photoW, photoH, gap, rows, cols, perPage, totalPages } = layout;

            // Create PDF with mm units
            const doc = new jsPDF({
              orientation: paperW > paperH ? 'landscape' : 'portrait',
              unit: 'mm',
              format: [paperW, paperH]
            });

            // For each page
            for (let page = 1; page <= totalPages; page++) {
              if (page > 1) doc.addPage([paperW, paperH], paperW > paperH ? 'landscape' : 'portrait');

              // Draw white background
              doc.setFillColor(255, 255, 255);
              doc.rect(0, 0, paperW, paperH, 'F');

              // Convert mm to PDF points? jsPDF with unit 'mm' uses mm coordinates directly.
              const totalGridW = cols * photoW + (cols - 1) * gap;
              const totalGridH = rows * photoH + (rows - 1) * gap;
              const offsetX = (paperW - totalGridW) / 2;
              const offsetY = (paperH - totalGridH) / 2;

              const startIndex = (page - 1) * perPage;

              // We need to draw each photo. Since we have an HTMLImageElement, we can convert to dataURL
              const imgData = getImageDataURL();

              for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                  const idx = startIndex + r * cols + c;
                  if (idx >= state.quantity) break;
                  const x = offsetX + c * (photoW + gap);
                  const y = offsetY + r * (photoH + gap);

                  // Draw border if needed
                  if (state.borderWidth > 0) {
                    // Convert border color to RGB
                    const rgb = hexToRgb(state.borderColor);
                    doc.setDrawColor(rgb.r, rgb.g, rgb.b);
                    doc.setLineWidth(state.borderWidth * 0.264583); // px to mm approx
                    doc.rect(x, y, photoW, photoH);
                  }

                  // Add image (cover fit)
                  // We need to crop the image to cover the rectangle without stretching
                  // jsPDF doesn't have built-in cover, so we calculate source cropping
                  const imgProps = getCoverCrop(state.image, photoW, photoH);
                  doc.addImage(imgData, 'JPEG', x, y, photoW, photoH, undefined, 'FAST', 0, imgProps.sx, imgProps.sy, imgProps.sw, imgProps.sh);
                }
                if (startIndex + (r + 1) * cols >= state.quantity) break;
              }

              // Page number
              if (totalPages > 1) {
                doc.setFontSize(8);
                doc.setTextColor(150, 150, 150);
                doc.text(`Page ${page} of ${totalPages}`, paperW / 2, paperH - 5, { align: 'center' });
              }
            }

            doc.save('photocraft-sheet.pdf');
            showToast('PDF downloaded successfully!', 'success');
            showLoading(false);
          } catch (err) {
            console.error(err);
            showToast('PDF export failed. Please try again.', 'error');
            showLoading(false);
          }
        }, 100);
      }

      // Helper to get image data URL for PDF
      function getImageDataURL() {
        const canvas = document.createElement('canvas');
        canvas.width = state.image.width;
        canvas.height = state.image.height;
        const ctx2 = canvas.getContext('2d');
        ctx2.drawImage(state.image, 0, 0);
        return canvas.toDataURL('image/jpeg', 0.95);
      }

      function getCoverCrop(img, targetW, targetH) {
        const imgAspect = img.width / img.height;
        const targetAspect = targetW / targetH;
        let sx, sy, sw, sh;
        if (imgAspect > targetAspect) {
          sh = img.height;
          sw = sh * targetAspect;
          sx = (img.width - sw) / 2;
          sy = 0;
        } else {
          sw = img.width;
          sh = sw / targetAspect;
          sx = 0;
          sy = (img.height - sh) / 2;
        }
        return { sx, sy, sw, sh };
      }

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : { r: 200, g: 200, b: 200 };
      }

      // ============================================================
      // PRINT
      // ============================================================
      function printSheet() {
        if (!state.imageLoaded) {
          showToast('Please upload a photo first.', 'error');
          return;
        }
        const layout = computeLayout();
        const { paperW, paperH, margin, photoW, photoH, gap, rows, cols, perPage, totalPages } = layout;

        showLoading(true);
        setTimeout(() => {
          try {
            const printWindow = window.open('', '_blank');
            if (!printWindow) {
              showToast('Please allow pop-ups to print.', 'error');
              showLoading(false);
              return;
            }

            const imgData = getImageDataURL();

            let html = `<!DOCTYPE html><html><head><title>Print Photo Sheet</title>
            <style>
              body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #fff; }
              .page { width: ${paperW}mm; height: ${paperH}mm; position: relative; page-break-after: always; background: white; }
              .photo { position: absolute; object-fit: cover; }
              .border { position: absolute; border: ${state.borderWidth}px solid ${state.borderColor}; box-sizing: border-box; }
              @media print { body { margin: 0; } .page { page-break-after: always; } }
            </style></head><body>`;

            for (let page = 1; page <= totalPages; page++) {
              const totalGridW = cols * photoW + (cols - 1) * gap;
              const totalGridH = rows * photoH + (rows - 1) * gap;
              const offsetX = (paperW - totalGridW) / 2;
              const offsetY = (paperH - totalGridH) / 2;

              const startIndex = (page - 1) * perPage;

              html += `<div class="page">`;
              for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                  const idx = startIndex + r * cols + c;
                  if (idx >= state.quantity) break;
                  const x = offsetX + c * (photoW + gap);
                  const y = offsetY + r * (photoH + gap);
                  html += `<div class="border" style="left:${x}mm; top:${y}mm; width:${photoW}mm; height:${photoH}mm;"></div>`;
                  html += `<img class="photo" src="${imgData}" style="left:${x}mm; top:${y}mm; width:${photoW}mm; height:${photoH}mm; object-fit:cover;" />`;
                }
                if (startIndex + (r + 1) * cols >= state.quantity) break;
              }
              html += `</div>`;
            }

            html += `</body></html>`;
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.onload = () => {
              printWindow.print();
              showLoading(false);
            };
          } catch (err) {
            console.error(err);
            showToast('Print failed.', 'error');
            showLoading(false);
          }
        }, 100);
      }

      // ============================================================
      // RESET
      // ============================================================
      function resetAll() {
        state.quantity = 12;
        state.photoWidthMm = 35;
        state.photoHeightMm = 45;
        state.gapMm = 2;
        state.borderWidth = 1;
        state.borderColor = '#cccccc';
        state.paperWidthMm = 210;
        state.paperHeightMm = 297;
        state.marginMm = 10;
        state.orientation = 'portrait';
        state.rows = 0;
        state.cols = 0;

        quantityInput.value = 12;
        totalPhotosDisplay.textContent = 12;
        photoWidthMm.value = 35;
        photoHeightMm.value = 45;
        gapMm.value = 2;
        borderWidth.value = 1;
        borderColor.value = '#cccccc';
        paperWidthMm.value = 210;
        paperHeightMm.value = 297;
        marginMm.value = 10;
        rowsInput.value = 0;
        colsInput.value = 0;
        orientation.value = 'portrait';

        // Reset active states
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.preset-btn[data-qty="12"]')?.classList.add('active');
        document.querySelectorAll('.size-preset-btn[data-size]').forEach(b => b.classList.remove('active'));
        document.querySelector('.size-preset-btn[data-size="35x45"]')?.classList.add('active');
        document.querySelectorAll('.size-preset-btn[data-paper]').forEach(b => b.classList.remove('active'));
        document.querySelector('.size-preset-btn[data-paper="a4"]')?.classList.add('active');

        renderPreview();
        showToast('Settings reset to defaults.', 'success');
      }

      // ============================================================
      // THEME
      // ============================================================
      function toggleDarkMode() {
        state.isDark = !state.isDark;
        document.body.classList.toggle('dark', state.isDark);
        themeIcon.setAttribute('data-lucide', state.isDark ? 'sun' : 'moon');
        themeLabel.textContent = state.isDark ? 'Light' : 'Dark';
        lucide.createIcons();
        localStorage.setItem('photocraft-dark', state.isDark ? '1' : '0');
      }

      function checkDarkMode() {
        const saved = localStorage.getItem('photocraft-dark');
        if (saved === '1') {
          state.isDark = true;
          document.body.classList.add('dark');
          themeIcon.setAttribute('data-lucide', 'sun');
          themeLabel.textContent = 'Light';
          lucide.createIcons();
        }
      }

      // ============================================================
      // UI HELPERS
      // ============================================================
      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'}"></i> ${message}`;
        toastContainer.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      function showLoading(show) {
        loadingOverlay.classList.toggle('active', show);
      }

      // ============================================================
      // START
      // ============================================================
      init();

      // Re-render on window resize (optional)
      window.addEventListener('resize', () => {
        // Debounce could be used, but simple re-render is fine
        renderPreview();
      });

    })();
  </script>
</body>
</html>
